name: CodeQL
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze Python and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
          build-mode: none
      # Keep SARIF as an artifact for private repositories without code-scanning upload entitlement.
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python-javascript'
          output: codeql-results
          upload: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-results
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 14
