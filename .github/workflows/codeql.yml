name: CodeQL
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      # Private repositories without GitHub code-scanning entitlement cannot upload SARIF.
      # Keep the analysis running and retain its SARIF output as a workflow artifact instead.
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python'
          output: codeql-results
          upload: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-results
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 14
