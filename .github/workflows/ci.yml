name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests sdk/python
      - name: Run Python tests
        run: pytest -q -ra --junitxml=test-results/python-tests.xml
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/sdk/python"
      - name: Run Node SDK tests
        run: node --test tests/sdk-node.test.mjs
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-release-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
