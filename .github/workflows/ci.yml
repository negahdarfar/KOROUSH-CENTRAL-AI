name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: install
        run: pip install -r requirements-dev.txt
      - id: compile
        run: python -m compileall -q app tests sdk/python
      - id: python_tests
        name: Run Python tests
        run: pytest -q -ra --junitxml=test-results/python-tests.xml
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/sdk/python"
      - id: node_tests
        name: Run Node SDK tests
        run: node --test tests/sdk-node.test.mjs
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-release-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish CI diagnostic summary to pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          SETUP_PYTHON: ${{ steps.setup_python.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          PYTHON_TESTS: ${{ steps.python_tests.outcome }}
          NODE_TESTS: ${{ steps.node_tests.outcome }}
        with:
          script: |
            const ids = ['CHECKOUT', 'SETUP_NODE', 'SETUP_PYTHON', 'INSTALL', 'COMPILE', 'PYTHON_TESTS', 'NODE_TESTS'];
            const rows = ids.map(id => `- ${id.toLowerCase()}: ${process.env[id] || 'not-run'}`);
            const body = [
              '### Integrated release CI diagnostic',
              '',
              `Commit: ${context.sha}`,
              `Run: ${context.runId}`,
              '',
              ...rows,
              '',
              'This comment reports step outcomes only; it does not override CI status.'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
