name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests sdk/python
      - name: Run Python tests
        run: pytest -q
      - name: Run Node SDK tests
        run: node --test tests/sdk-node.test.mjs
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/sdk/python"
